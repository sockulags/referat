[project]
name = "referat-transcription"
version = "0.1.0"
description = "Managed local faster-whisper runtime for referat"
requires-python = ">=3.11,<3.13"
dependencies = [
  "faster-whisper>=1.1.0",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "python-multipart>=0.0.20",
]

[project.scripts]
referat-transcription = "referat_transcription.app:main"

[dependency-groups]
dev = ["pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/referat_transcription"]
