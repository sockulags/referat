name: Release build

# Verifiable CI build of the Windows installer (required for SignPath signing).
# Runs on version tags; the unsigned artifact is uploaded for signing/release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Local builds sign with the store-based cert (electron-builder.yml);
      # CI builds are unsigned — signing happens via SignPath after approval.
      # electron-builder 26 parses `-c.win.signtoolOptions=null` as a config
      # FILE path, so generate a config with the signing key stripped instead.
      - run: node -e "const fs=require('fs'),yaml=require('js-yaml');const c=yaml.load(fs.readFileSync('electron-builder.yml','utf8'));delete c.win.signtoolOptions;fs.writeFileSync('electron-builder.ci.yml',yaml.dump(c))"
      - run: npx electron-builder --win --publish never --config electron-builder.ci.yml
      - uses: actions/upload-artifact@v7
        with:
          name: referat-windows-setup
          path: |
            dist/*-setup.exe
            dist/*.blockmap
          if-no-files-found: error

  build-local-ai-components:
    name: Local AI ${{ matrix.component }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        component: [transcription-cpu, diarization-cpu, diarization-gpu]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - shell: pwsh
        # The diarization components bundle the pyannote weights, which are
        # gated on Hugging Face. The token is read once here so that users
        # never need an account of their own.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: ./scripts/build-local-ai-components.ps1 -Component ${{ matrix.component }}
      - uses: actions/upload-artifact@v7
        with:
          name: referat-${{ matrix.component }}-win-x64
          path: dist/local-ai-components/*
          if-no-files-found: error
